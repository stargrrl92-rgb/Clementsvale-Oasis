<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clementsvale Oasis Availability</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#d9d9d9;color:#111;font:16px/1.5 Arial,sans-serif}h2{font-family:Georgia,serif}.bar{display:flex;justify-content:space-between;align-items:center}button{font:inherit;cursor:pointer;border:0;border-radius:24px;padding:9px 16px;background:#ff5e1a;color:#111}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:16px}.day{min-height:48px;padding:5px;border:1px solid #999;border-radius:6px}.open{background:white}.red{background:#c62828;color:white}.blue{background:#1565c0;color:white}.past,.unknown{background:#bbb;color:#444}.selected{background:#ff5e1a;color:#111;outline:2px solid black}.legend{display:flex;gap:15px;flex-wrap:wrap;margin:18px 0}.legend i{display:inline-block;width:14px;height:14px;border:1px solid #888;margin-right:6px}#message{padding:12px;background:#eee}button:focus-visible{outline:3px solid black;outline-offset:3px}</style></head><body><h2>Clementsvale Oasis Availability</h2><div class="bar"><button id="prev" aria-label="Previous month">←</button><strong id="month"></strong><button id="next" aria-label="Next month">→</button></div><div class="legend"><span><i class="red"></i>Booked / unavailable</span><span><i class="blue"></i>Pending</span><span><i class="open"></i>Available to request</span></div><div id="grid" class="grid"></div><p id="message" role="status">Connecting to Wix…</p><button id="clear">Clear selection</button> <button id="refresh">Refresh</button><p id="checked"></p><small>Select check-in, then check-out. Checkout is not an occupied night. Complete the Wix request form below. Requests require Sherry’s confirmation; no payment is taken here.</small><script>
const ORIGIN='https://REPLACE-WITH-YOUR-PUBLISHED-WIX-ORIGIN.example';
let state=null,start=null,end=null,view=new Date();const grid=document.querySelector('#grid'),message=document.querySelector('#message');
function send(m){window.parent.postMessage({channel:'oasis-calendar',...m},ORIGIN);}
function add(s,n){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function status(s){if(!state?.ok)return 'unknown';if(s<state.today||s>=state.horizon)return 'past';if(state.booked.includes(s))return 'red';if(state.pending.includes(s))return 'blue';return 'open';}
function validEnd(s){if(!state?.ok||!start||s<=start||s>=state.horizon)return false;let count=0;for(let d=start;d<s;d=add(d,1)){if(++count>90||status(d)!=='open')return false;}return true;}
function clear(){start=null;end=null;send({type:'clear'});}
function choose(s){if(start&&!end&&validEnd(s)){end=s;send({type:'selection',startDate:start,endDate:end});message.textContent='Selected '+start+' to '+end+'. Complete the Wix form below.';}else if(status(s)==='open'){clear();start=s;message.textContent='Check-in '+s+'. Choose check-out.';}render();}
function render(){document.querySelector('#month').textContent=view.toLocaleDateString('en-CA',{month:'long',year:'numeric'});grid.replaceChildren();['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(t=>{const e=document.createElement('div');e.textContent=t;grid.append(e);});const y=view.getFullYear(),m=view.getMonth(),offset=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++)grid.append(document.createElement('span'));for(let n=1;n<=last;n++){const s=key(new Date(y,m,n)),st=status(s),b=document.createElement('button'),checkout=start&&!end&&validEnd(s);b.type='button';b.className='day '+st;b.textContent=n;b.disabled=!(st==='open'||checkout);b.setAttribute('aria-label',s+' '+st+(checkout?' — possible checkout':''));if(start&&(s===start||(end&&s>=start&&s<end)))b.classList.add('selected');b.onclick=()=>choose(s);grid.append(b);}}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.origin!==ORIGIN)return;const m=e.data;if(m?.channel!=='oasis-calendar'||m.type!=='availability')return;state=m.state;clear();if(state?.ok&&Array.isArray(state.booked)&&Array.isArray(state.pending)){message.textContent='Choose check-in, then check-out.';document.querySelector('#checked').textContent='Feeds checked: '+new Date(state.checkedAt).toLocaleString();}else{state={ok:false};message.textContent='Availability cannot be verified. Please contact Sherry.';document.querySelector('#checked').textContent='';}render();});
document.querySelector('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};document.querySelector('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};document.querySelector('#clear').onclick=()=>{clear();message.textContent='Choose check-in and check-out.';render();};document.querySelector('#refresh').onclick=()=>{state=null;clear();render();message.textContent='Refreshing…';send({type:'refresh'});};render();send({type:'ready'});let tries=0;const timer=setInterval(()=>{if(state||++tries>12){clearInterval(timer);if(!state)message.textContent='Wix connection not configured. Open this calendar on the published Wix booking page.';}else send({type:'ready'});},1500);
</script></body></html>
